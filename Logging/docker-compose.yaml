services:

  # ==========================
  # FILEBEAT
  # ==========================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: filebeat
    user: root
    restart: unless-stopped
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /home/rusok/Descargas/SistemaVentas/producto-service/target/logs:/var/log/apps:ro
      - /home/rusok/Descargas/SistemaVentas/pedido-service/target/logs:/var/log/apps2:ro
      - /home/rusok/Descargas/SistemaVentas/inventario-service/target/logs:/var/log/apps3:ro
    depends_on:
      - logstash
    networks:
      - observability

  # ==========================
  # LOGSTASH
  # ==========================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - observability
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - observability
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
    networks:
      - observability
networks:
  observability:
    driver: bridge
volumes:
  esdata: