filebeat.inputs:

  - type: log
    enabled: true
    paths:
      - /var/log/apps/*.log
    fields:
      service: "producto-service"
  - type: log
    enabled: true
    paths:
      - /var/log/apps2/*.log
    fields:
      service: "pedido-service"
  - type: log
    enabled: true
    paths:
      - /var/log/apps3/*.log
    fields:
      service: "inventario-service"
# Enviar eventos a Logstash
output.logstash:
  hosts: ["logstash:5044"]
